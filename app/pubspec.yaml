name: lapse
description: แอปจับเวลาอ่านหนังสือแนวมินิมอล — หนึ่งวัน หนึ่งหน้า
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # dependency ตัวเดียวของโปรเจกต์ — ใช้หาโฟลเดอร์เอกสารของแอปเท่านั้น
  # ทุกตัวที่จะเพิ่มหลังจากนี้ต้องมีเหตุผล การตัดออกคือฟีเจอร์
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # ระบบนี้ไม่ใช้คอมโพเนนต์ของ Material เลยสักตัว วาดเองทั้งหมด (§6.4)
  uses-material-design: false

  fonts:
    # mono = สิ่งที่ "เครื่อง" ใส่ — เวลา วันที่ ตัวเลข handle ป้าย
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Light.ttf
          weight: 300
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500

    # sans thai = สิ่งที่ "มนุษย์" พิมพ์ — ชื่องาน journal
    - family: IBM Plex Sans Thai
      fonts:
        - asset: assets/fonts/IBMPlexSansThai-Light.ttf
          weight: 300
        - asset: assets/fonts/IBMPlexSansThai-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansThai-Medium.ttf
          weight: 500
